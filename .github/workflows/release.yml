name: Release

# Push a tag like v0.2.0 to build TrayTrim for Windows (installer and portable zip), macOS
# (Apple silicon) and Linux (x86-64), and attach them to a draft GitHub release for that tag.
# Run it by hand (Actions > Release > Run workflow) to build and smoke-test without releasing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read   # only the release job below writes

env:
  QT_QPA_PLATFORM: offscreen

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[gui,dev,build]"
      - name: Tag matches the app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(python -c "import traytrim; print(traytrim.__version__)")
          test "${GITHUB_REF_NAME}" = "v${version}" || { echo "Tag ${GITHUB_REF_NAME} but traytrim.__version__ is ${version}"; exit 1; }
      - run: python -m pytest
      - name: Inno Setup
        run: choco install innosetup --no-progress -y
      - run: python packaging/build.py
      - name: The built app starts
        shell: pwsh
        run: |
          $env:TRAYTRIM_SMOKE_TEST = "1"
          $app = Start-Process dist/TrayTrim/TrayTrim.exe -PassThru
          if (-not $app.WaitForExit(60000)) { Stop-Process -Id $app.Id -Force; throw "TrayTrim.exe didn't quit" }
          if ($app.ExitCode -ne 0) { throw "TrayTrim.exe exited with $($app.ExitCode)" }
      - name: Portable zip
        shell: bash
        run: |
          version=$(python -c "import traytrim; print(traytrim.__version__)")
          pwsh -Command "Compress-Archive -Path dist/TrayTrim -DestinationPath dist/TrayTrim-${version}-windows-portable.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/TrayTrim-*-setup.exe
            dist/TrayTrim-*-windows-portable.zip

  macos:
    runs-on: macos-latest   # Apple silicon
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[gui,dev,build]"
      - run: python -m pytest
      - run: python packaging/build.py
      - name: The built app starts
        # macOS has no `timeout`: give the app 60 seconds to quit by itself.
        run: |
          TRAYTRIM_SMOKE_TEST=1 dist/TrayTrim.app/Contents/MacOS/TrayTrim &
          pid=$!
          for _ in $(seq 60); do kill -0 "$pid" 2>/dev/null || break; sleep 1; done
          if kill -0 "$pid" 2>/dev/null; then kill "$pid"; echo "TrayTrim didn't quit"; exit 1; fi
          wait "$pid"
      - name: Zip the app
        run: |
          version=$(python -c "import traytrim; print(traytrim.__version__)")
          ditto -c -k --keepParent dist/TrayTrim.app "dist/TrayTrim-${version}-macos-arm64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/TrayTrim-*-macos-arm64.zip

  linux:
    runs-on: ubuntu-22.04   # an older glibc, so the build runs on more distributions
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Qt system libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: python -m pip install -e ".[gui,dev,build]"
      - run: python -m pytest
      - run: python packaging/build.py
      - name: The built app starts
        run: TRAYTRIM_SMOKE_TEST=1 timeout 60 dist/TrayTrim/TrayTrim
      - name: Archive the app
        run: |
          version=$(python -c "import traytrim; print(traytrim.__version__)")
          tar -C dist -czf "dist/TrayTrim-${version}-linux-x86_64.tar.gz" TrayTrim
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/TrayTrim-*-linux-x86_64.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # creates the draft release
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: artifacts/*
