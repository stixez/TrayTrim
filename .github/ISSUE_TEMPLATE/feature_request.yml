name: Idea
description: Something TrayTrim could do, or do better.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you're trying to do
      description: The situation, not the solution yet. What's hard or slow about it today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
