[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "traytrim"
dynamic = ["version"]
description = "Export a Sims 4 household, lot or room with only the custom content it uses."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "stixez" }]
requires-python = ">=3.12"
dependencies = []
keywords = ["sims 4", "the sims 4", "custom content", "cc", "mods", "tray", "tray importer",
            "dbpf", "package"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Environment :: X11 Applications :: Qt",
    "Topic :: Games/Entertainment :: Simulation",
]

[project.urls]
Homepage = "https://github.com/stixez/TrayTrim"
Issues = "https://github.com/stixez/TrayTrim/issues"

[project.optional-dependencies]
gui = ["PySide6>=6.8"]
dev = ["pytest>=8"]
build = ["pyinstaller>=6.10", "pillow>=10"]

[project.scripts]
traytrim = "traytrim.cli:main"

[tool.setuptools.dynamic]
version = { attr = "traytrim.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
traytrim = ["gui/assets/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# N: Qt overrides keep their camelCase names with `# noqa: N802`.
select = ["E", "F", "W", "UP", "B", "SIM", "N", "RUF", "BLE"]
# × is UI text; str enums are compared as strings; try/except/pass reads fine here.
ignore = ["RUF001", "RUF002", "RUF005", "UP042", "SIM105", "SIM108", "N818"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["PySide6.QtCore.QModelIndex"]
